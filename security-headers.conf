# Shared security headers.
#
# nginx only inherits add_header from an outer level when the inner level
# declares NO add_header of its own. Both content locations set their own
# Cache-Control, which would silently discard every header defined at server
# level, including the CSP on the one response that needs it: index.html.
# Keeping them in one file and including it at each level makes that impossible
# to get wrong again.
#
# The SPA is self-hosted: no CDN scripts, no external fonts, no inline scripts.
# The one third party is Plausible analytics (cookieless): its script and its
# event endpoint on https://plausible.io, loaded by /plausible-init.js. 'unsafe-inline' is allowed for styles only, because the design is
# built from inline style objects. connect-src covers the API and the chat
# websocket, both same-origin through this proxy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss: https://plausible.io; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Railway (and any TLS-terminating edge) serves the site over https end to end,
# so browsers may pin it. Harmless for the plain-http compose stack on :8080:
# browsers ignore this header unless it arrives over https.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
